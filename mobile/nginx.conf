server {
  listen 80;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # La API vive en el mismo origen: la app la encuentra sola.
  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_read_timeout 90s; }
  location = /health { proxy_pass http://api:8000; }

  location /_expo/ { expires 30d; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri $uri.html $uri/ /index.html; }
}
